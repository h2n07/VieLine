<text x="24" y="38" style="font-size:22px;font-weight:700;fill:#111827">VieLine · sơ đồ đấu nối v0.8 (dễ hàn: chỉ mỏ hàn thường, linh kiện chân cắm)</text>
<text class="n" x="24" y="60">Hai chân cùng tên nhãn = nối với nhau. Hàn thẳng bằng sợi tách từ dây bẹ 28AWG, không dùng dây cắm Dupont (rung xe sẽ làm lỏng).</text>
