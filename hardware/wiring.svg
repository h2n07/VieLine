<text class="h" x="414" y="114">ESP32-S3 SuperMini (Nologo)</text>
<text class="n" x="414" y="132">S3 2 nhân 240 MHz · 4 MB flash · 2 MB PSRAM · sạc pin trên mạch</text>
<rect x="520" y="146" width="160" height="22" rx="5" fill="#fee2e2" stroke="#dc2626"/><text class="n" x="600" y="161" text-anchor="middle">USB-C: sạc + nạp firmware</text>
<text class="n" x="600" y="186" text-anchor="middle">nhìn mặt có chip, cổng USB-C ở trên · hàn theo nhãn in trên mạch</text>
