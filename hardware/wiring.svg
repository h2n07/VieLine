<text class="tag" x="436.8" y="505.5" text-anchor="middle">trống</text>
<text class="m" x="467.5" y="506">IO7</text>
<rect x="762.4" y="204" width="23.6" height="18" rx="4" fill="#DC2626"/>
<text class="tag" x="774.2" y="217.5" text-anchor="middle">V5</text>
<text class="m" x="754.4" y="218" text-anchor="end">5V</text>
<rect x="755.1" y="240" width="30.9" height="18" rx="4" fill="#111827"/>
<text class="tag" x="770.6" y="253.5" text-anchor="middle">GND</text>
<text class="m" x="747.1" y="254" text-anchor="end">GND</text>
<rect x="747.8" y="276" width="38.2" height="18" rx="4" fill="#DC2626"/>
<text class="tag" x="766.9" y="289.5" text-anchor="middle">+3V3</text>
<text class="m" x="739.8" y="290" text-anchor="end">3V3</text>
<rect x="733.2" y="312" width="52.8" height="18" rx="4" fill="#7C3AED"/>
<text class="tag" x="759.6" y="325.5" text-anchor="middle">PWR_EN</text>
<text class="m" x="725.2" y="326" text-anchor="end">IO13</text>
<rect x="725.9" y="348" width="60.1" height="18" rx="4" fill="#2563EB"/>
<text class="tag" x="755.9" y="361.5" text-anchor="middle">LCD_SCK</text>
<text class="m" x="717.9" y="362" text-anchor="end">IO12</text>
<rect x="718.6" y="384" width="67.4" height="18" rx="4" fill="#2563EB"/>
<text class="tag" x="752.3" y="397.5" text-anchor="middle">LCD_MOSI</text>
<text class="m" x="710.6" y="398" text-anchor="end">IO11</text>
<rect x="733.2" y="420" width="52.8" height="18" rx="4" fill="#2563EB"/>
<text class="tag" x="759.6" y="433.5" text-anchor="middle">LCD_CS</text>
<text class="m" x="725.2" y="434" text-anchor="end">IO10</text>
<rect x="733.2" y="456" width="52.8" height="18" rx="4" fill="#2563EB"/>
<text class="tag" x="759.6" y="469.5" text-anchor="middle">LCD_DC</text>
<text class="m" x="725.2" y="470" text-anchor="end">IO9</text>
<rect x="725.9" y="492" width="60.1" height="18" rx="4" fill="#7C3AED"/>
<text class="tag" x="755.9" y="505.5" text-anchor="middle">LCD_RST</text>
<text class="m" x="717.9" y="506" text-anchor="end">IO8</text>
<text class="n" x="416" y="562">Pad BAT+ / BAT− cạnh cổng USB-C: nối OUT+ / OUT− của TP4056.</text>
<text class="n" x="416" y="579">Mặt sau: chấm thiếc nối cầu BOOST → sạc 300 mA.</text>
<text class="n" x="416" y="596">IO3 là chân strap: để trống.</text>
<rect x="20" y="90" width="360" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="h" x="34" y="114">Module màn tròn GC9A01 1.28" 240×240</text>
<text class="n" x="34" y="132">7 chân 2,54 · có LDO trên PCB · đèn nền luôn sáng</text>
<text class="m" x="36" y="154">VCC</text>
<rect x="84.0" y="140" width="67.4" height="18" rx="4" fill="#DC2626"/>
<text class="tag" x="117.7" y="153.5" text-anchor="middle">+3V3_LCD</text>
<text class="n" x="159.4" y="154">qua Q1 → tắt hẳn khi ngủ</text>
<text class="m" x="36" y="185">GND</text>
<rect x="84.0" y="171" width="30.9" height="18" rx="4" fill="#111827"/>
<text class="tag" x="99.5" y="184.5" text-anchor="middle">GND</text>
<text class="m" x="36" y="216">SCL</text>
<rect x="84.0" y="202" width="60.1" height="18" rx="4" fill="#2563EB"/>
<text class="tag" x="114.0" y="215.5" text-anchor="middle">LCD_SCK</text>
<text class="n" x="152.1" y="216">IO12 = FSPICLK, tới 80 MHz</text>
<text class="m" x="36" y="247">SDA</text>
<rect x="84.0" y="233" width="67.4" height="18" rx="4" fill="#2563EB"/>
<text class="tag" x="117.7" y="246.5" text-anchor="middle">LCD_MOSI</text>
<text class="n" x="159.4" y="247">IO11 = FSPID</text>
<text class="m" x="36" y="278">DC</text>
<rect x="84.0" y="264" width="52.8" height="18" rx="4" fill="#2563EB"/>
<text class="tag" x="110.4" y="277.5" text-anchor="middle">LCD_DC</text>
<text class="m" x="36" y="309">CS</text>
<rect x="84.0" y="295" width="52.8" height="18" rx="4" fill="#2563EB"/>
<text class="tag" x="110.4" y="308.5" text-anchor="middle">LCD_CS</text>
<text class="n" x="144.8" y="309">IO10 = FSPICS0</text>
<text class="m" x="36" y="340">RST</text>
<rect x="84.0" y="326" width="60.1" height="18" rx="4" fill="#7C3AED"/>
<text class="tag" x="114.0" y="339.5" text-anchor="middle">LCD_RST</text>
<text class="n" x="36" y="388">7 sợi liền nhau tách từ dây bẹ, hàn từ mặt sau đuôi PCB.</text>
<text class="n" x="36" y="405">Mọi dây của màn về cùng hàng chân phải của S3.</text>
<rect x="820" y="90" width="360" height="262" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="h" x="834" y="114">Chỉ cần mỏ hàn thường, không cần khò</text>
<text class="n" x="836" y="140">• Thêm đúng 5 linh kiện, tất cả loại chân cắm:</text>
<text class="n" x="836" y="157">   D1 1N5819, Q1 S8550, R1 R2 100k, R3 1k.</text>
<text class="n" x="836" y="174">• Không gỡ hay thay linh kiện dán nào trên mạch.</text>
<text class="n" x="836" y="191">• Sạc bằng chip trên mạch S3 (300 mA khi nối cầu</text>
<text class="n" x="836" y="208">   BOOST); TP4056 chỉ làm mạch bảo vệ pin.</text>
<text class="n" x="836" y="225">• Rút cáp: pin → TP4056 → BAT+ → diode → 5V → 3V3.</text>
<text class="n" x="836" y="242">• D1 hàn song song diode trên mạch S3: diode gốc</text>
<text class="n" x="836" y="259">   rất nhỏ, đã có người báo bị cháy.</text>
<text class="n" x="836" y="276">• Đo 1 điểm V5 biết cả 2 việc: IO1 ≥ 2,3 V là đang</text>
<text class="n" x="836" y="293">   cắm sạc; thấp hơn thì V_pin ≈ 2·V_IO1 + 0,3 V.</text>
<rect x="820" y="364" width="360" height="256" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="h" x="834" y="388">Q1: nguồn màn (màn không có chân BLK)</text>
<text class="n" x="836" y="412">Đèn nền sáng liên tục ~20 mA → Q1 cắt hẳn nguồn</text>
<text class="n" x="836" y="429">màn khi deep sleep. Q1 là transistor PNP chân cắm:</text>
<text class="n" x="836" y="446">E vào 3V3, C ra VCC màn, B qua R3 1k về IO13</text>
<text class="n" x="836" y="463">(2 chân 3V3 và IO13 nằm gần nhau ở hàng phải).</text>
<text class="n" x="836" y="480">IO13 = 0 → bật. Khi ngủ firmware giữ IO13 = 1</text>
<text class="n" x="836" y="497">(gpio_hold). Trước khi tắt: đặt chân SPI/RST về</text>
<text class="n" x="836" y="514">INPUT. Lúc bật, firmware bật từ từ (PWM ~10 ms)</text>
<text class="n" x="836" y="531">cho khỏi sụt áp, nên không cần tụ.</text>
<text class="h" x="24" y="660">Nguồn: 1 cổng USB-C · sạc bằng chip trên S3 · TP4056 chỉ làm mạch bảo vệ pin</text>
<rect x="20" y="674" width="1160" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<path d="M46 744H74M52 754H68M46 764H74M52 774H68" stroke="#111827" stroke-width="2" fill="none"/>
<text class="t" x="30" y="824">LiPo 3,7 V</text><text class="n" x="30" y="840">400 mAh 562527</text>
<path d="M60 744V730H140" stroke="#111827" stroke-width="1.6" fill="none"/>
<path d="M60 774V788H140" stroke="#111827" stroke-width="1.6" fill="none"/>
<rect x="140" y="698" width="320" height="160" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text class="t" x="300.0" y="762" text-anchor="middle" style="font-weight:600">TP4056 Type-C</text>
<text class="n" x="300.0" y="816" text-anchor="middle">DW01 + 8205: chống quá xả, quá dòng, chập</text>
<text class="n" x="300.0" y="832" text-anchor="middle">IN+ / IN− và cổng USB-C của mạch này bỏ trống</text>
<text class="n" x="300.0" y="848" text-anchor="middle">không cần sửa gì trên mạch</text>
<text class="m" x="148" y="734">B+</text>
<text class="m" x="148" y="792">B−</text>
<text class="m" x="452" y="718" text-anchor="end">IN+ (trống)</text>
<text class="m" x="452" y="750" text-anchor="end">OUT+</text>
<text class="m" x="452" y="798" text-anchor="end">OUT−</text>
<rect x="600" y="698" width="260" height="150" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text class="t" x="730.0" y="770" text-anchor="middle" style="font-weight:600">ESP32-S3 SuperMini</text>
<text class="n" x="730.0" y="822" text-anchor="middle">TP4054 trên mạch: 300 mA khi nối cầu BOOST</text>
<text class="n" x="730.0" y="838" text-anchor="middle">diode nhỏ BAT+ → 5V · LDO 3V3</text>
<text class="m" x="608" y="750">BAT+</text>
<text class="m" x="608" y="798">BAT− / GND</text>
<text class="m" x="852" y="718" text-anchor="end">5V</text>
<path d="M460 746H600" stroke="#111827" stroke-width="1.6" fill="none"/>
<path d="M460 794H600" stroke="#111827" stroke-width="1.6" fill="none"/>
<rect x="474.0" y="726" width="38.2" height="18" rx="4" fill="#DC2626"/>
<text class="tag" x="493.1" y="739.5" text-anchor="middle">BAT+</text>
<rect x="474.0" y="774" width="30.9" height="18" rx="4" fill="#111827"/>
<text class="tag" x="489.4" y="787.5" text-anchor="middle">GND</text>
<circle cx="550" cy="746" r="3" fill="#111827"/>
<path d="M550 746V878H640" stroke="#111827" stroke-width="1.6" fill="none"/>
<path d="M640 869L658 878L640 887Z" fill="#111827"/><path d="M658 868V888" stroke="#111827" stroke-width="2"/>
<text class="t" x="649" y="862" text-anchor="middle">D1 1N5819 (vạch về phía 5V)</text>
<path d="M658 878H900V714H860" stroke="#111827" stroke-width="1.6" fill="none"/>
<circle cx="900" cy="714" r="3" fill="#111827"/>
<rect x="908.0" y="704" width="23.6" height="18" rx="4" fill="#DC2626"/>
<text class="tag" x="919.8" y="717.5" text-anchor="middle">V5</text>
<text class="n" x="908" y="750">Cắm cáp: máy chạy bằng USB, chip trên S3</text>
<text class="n" x="908" y="767">sạc 300 mA, đầy khoảng 1,5–2 giờ (dưới 1C).</text>
<text class="n" x="908" y="784">Rút cáp: pin → TP4056 → BAT+ → diode → 5V.</text>
<text class="n" x="908" y="801">TP4056 ngắt pin khi quá xả / quá dòng / chập.</text>
<text class="n" x="908" y="818">Pin &lt; ~3,45 V (V5 ≈ 3,15 V): firmware cho ngủ.</text>
<text class="n" x="908" y="835">Sạc C–C không ăn thì dùng cáp A–C.</text>
<text class="h" x="24" y="934">Mạch phụ (linh kiện chân cắm, hàn treo trên dây, bọc gen co hoặc keo 705)</text>
<rect x="20" y="948" width="376" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="t" x="32" y="970" style="font-weight:600">Đo V5 (ADC)</text>
<rect x="412" y="948" width="376" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="t" x="424" y="970" style="font-weight:600">Nguồn màn (Q1 S8550 PNP)</text>
<rect x="804" y="948" width="376" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="t" x="816" y="970" style="font-weight:600">Nút bấm chống nước</text>
<rect x="60.0" y="978" width="23.6" height="18" rx="4" fill="#DC2626"/>
<text class="tag" x="71.8" y="991.5" text-anchor="middle">V5</text>
<path d="M80 998V1000" stroke="#111827" stroke-width="1.6" fill="none"/>
<polyline points="80,1000 80,1008 87,1009.5 73,1012.5 87,1015.5 73,1018.5 87,1021.5 73,1024.5 80,1026 80,1034" fill="none" stroke="#111827" stroke-width="1.6"/>
