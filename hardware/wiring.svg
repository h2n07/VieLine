<path d="M80 1078V1086M70 1086H90M74 1090H86M78 1094H82" stroke="#111827" stroke-width="1.6" fill="none"/>
<text class="n" x="210" y="1064">USB: ≥ 2,3 V · pin: ≤ 2,0 V</text>
<text class="n" x="210" y="1081">rò ~20 µA</text>
<rect x="532.0" y="978" width="38.2" height="18" rx="4" fill="#DC2626"/>
<text class="tag" x="551.1" y="991.5" text-anchor="middle">+3V3</text>
<path d="M562 998V1010" stroke="#111827" stroke-width="1.6" fill="none"/>
<rect x="536" y="1010" width="52" height="30" rx="5" fill="#fff" stroke="#111827" stroke-width="1.4"/>
<text class="t" x="562" y="1030" text-anchor="middle" style="font-weight:600">Q1</text>
<text class="m" x="592" y="1020">E</text><text class="m" x="592" y="1038">C</text><text class="m" x="522" y="1021">B</text>
<path d="M562 1040V1060" stroke="#111827" stroke-width="1.6" fill="none"/>
<rect x="526.0" y="1060" width="67.4" height="18" rx="4" fill="#DC2626"/>
<text class="tag" x="559.7" y="1073.5" text-anchor="middle">+3V3_LCD</text>
<rect x="482" y="1019" width="26" height="12" rx="2" fill="#fff" stroke="#111827" stroke-width="1.4"/>
<text class="n" x="495" y="1014" text-anchor="middle">R3 1k</text>
<path d="M536 1025H508" stroke="#111827" stroke-width="1.6" fill="none"/>
<path d="M482 1025H470" stroke="#111827" stroke-width="1.6" fill="none"/>
<rect x="415.2" y="1015" width="52.8" height="18" rx="4" fill="#7C3AED"/>
<text class="tag" x="441.6" y="1028.5" text-anchor="middle">PWR_EN</text>
<text class="n" x="626" y="1004">PNP chân cắm TO-92.</text>
<text class="n" x="626" y="1021">Mặt chữ quay về mình,</text>
<text class="n" x="626" y="1038">chân trái → phải:</text>
<text class="n" x="626" y="1055">E · B · C.</text>
<rect x="856.0" y="978" width="30.9" height="18" rx="4" fill="#7C3AED"/>
<text class="tag" x="871.5" y="991.5" text-anchor="middle">BTN</text>
